[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vllm-hust-ext"
version = "0.2.0.dev0"
description = "Core and host-provider manager for vLLM-HUST extensions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "vLLM-HUST"}]
dependencies = [
  "cryptography>=3.4",
  "jcs==0.2.1",
  "packaging>=24.0",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
test = ["jsonschema>=4.0", "pytest>=8.0", "ruff>=0.12"]

[project.scripts]
vllm-hust-ext = "vllm_hust_ext.cli:main"
ecpa-formal-source = "vllm_hust_ext.formal_lifecycle_source:main"

[project.urls]
Repository = "https://github.com/vLLM-HUST/extension-manager"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
